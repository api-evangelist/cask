apis:
- aid: cask:cdap-microservices
  name: CDAP Microservices API
  description: >-
    The CDAP HTTP RESTful API, documented as "Microservices". All endpoints sit under a /v3 path prefix
    on a self-hosted CDAP router (default port 11015, or 10443 when SSL is enabled), and are scoped by
    namespace (/v3/namespaces/<namespace-id>/...). When security is enabled every call must carry an
    Authorization: Bearer <access-token> header issued by the CDAP authentication server.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477692124/Microservices+Introduction
  baseURL: http://localhost:11015/v3
  x-deployment: self-hosted
  x-base-url-note: >-
    CDAP is self-hosted software; there is no vendor-operated public API host. The documented base URL is
    http://<host>:<port> where port defaults to 11015 (router.bind.port), or 10443 when SSL is enabled
    (router.ssl.server.port). localhost:11015 is the value CDAP's own documentation uses in its curl examples.
  tags:
  - CDAP
  - REST
  - Microservices
  properties:
  - type: Documentation
    url: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477593807/CDAP+Microservices+Guide
  - type: APIReference
    url: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477692124/Microservices+Introduction
  - type: Authentication
    url: authentication/cask-authentication.yml
  - type: ErrorCatalog
    url: errors/cask-problem-types.yml
- aid: cask:cdap-lifecycle
  name: CDAP Lifecycle Microservices
  description: >-
    Deploy, start, stop, and manage the lifecycle of CDAP applications and the programs they contain
    within a namespace.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477560983/Lifecycle+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Lifecycle
  - Applications
  - Programs
- aid: cask:cdap-artifact
  name: CDAP Artifact Microservices
  description: >-
    Manage CDAP artifacts — the packaged application and plugin JARs that applications are created from —
    including deployment, versioning, and plugin inspection.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477692148/Artifact+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Artifacts
  - Plugins
- aid: cask:cdap-metadata
  name: CDAP Metadata Microservices
  description: >-
    Search, annotate, and retrieve business and technical metadata and lineage for CDAP entities such as
    applications, datasets, programs, and fields.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477692187/Metadata+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Metadata
  - Lineage
  - Data Governance
- aid: cask:cdap-metrics
  name: CDAP Metrics Microservices
  description: >-
    Query the metrics CDAP collects for system and user programs, including time-series queries across
    metric contexts and tags.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477692194/Metrics+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Metrics
  - Monitoring
- aid: cask:cdap-logging
  name: CDAP Logging Microservices
  description: >-
    Retrieve and download logs emitted by CDAP system services and by user applications and programs,
    with filtering by time range and log level.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477790558/Logging+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Logging
  - Observability
- aid: cask:cdap-namespace
  name: CDAP Namespace Microservices
  description: >-
    Create, list, and delete CDAP namespaces — the multi-tenancy boundary that isolates applications,
    datasets, and metadata. The cdap, default, and system namespaces are reserved.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477561041/Namespace+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Namespaces
  - Multi-tenancy
- aid: cask:cdap-pipeline
  name: CDAP Pipeline Microservices
  description: >-
    Programmatically create, deploy, run, and inspect CDAP data pipelines (the Hydrator / Data Fusion
    pipeline application type) and their plugin configurations.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/975929350/Pipeline+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Pipelines
  - ETL
  - Data Integration
- aid: cask:cdap-replication
  name: CDAP Replication Microservices
  description: >-
    Manage CDAP replication (change data capture) jobs that stream changes from source databases into
    analytic targets such as BigQuery.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/1765507073/Replication+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Replication
  - CDC
  - Data Integration
- aid: cask:cdap-security
  name: CDAP Security Microservices
  description: >-
    Manage CDAP secure store keys and authorization privileges, roles, and policies for principals
    operating against a security-enabled CDAP cluster.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477790661/Security+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Security
  - Authorization
  - Secure Store
- aid: cask:cdap-workflow
  name: CDAP Workflow Microservices
  description: >-
    Inspect and control CDAP workflows — multi-node program orchestration — including run records, node
    states, local datasets, and workflow tokens.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477790711/Workflow+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Workflows
  - Orchestration
- aid: cask:cdap-preferences
  name: CDAP Preferences Microservices
  description: >-
    Read and write preferences — the hierarchical configuration key/value pairs resolved across the
    instance, namespace, application, and program scopes.
  humanURL: https://cdap.atlassian.net/wiki/spaces/DOCS/pages/477561058/Preferences+Microservices
  baseURL: http://localhost:11015/v3
  tags:
  - Preferences
  - Configuration
