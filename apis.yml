aid: cask
name: Cask
description: >-
  Cask Data, Inc. was the enterprise big-data startup, backed by Andreessen Horowitz, that built and
  open-sourced CDAP — the Cask Data Application Platform — a framework for building and running data
  analytic applications and data pipelines on Hadoop, Spark, Kubernetes, and the cloud. Cask was
  acquired by Google Cloud; CDAP continues as an Apache-2.0 open source project under the
  github.com/cdapio organization and powers Google Cloud Data Fusion. CDAP's programmatic surface is
  its HTTP RESTful "Microservices" API — 21 documented service families (Lifecycle, Artifact, Metadata,
  Metrics, Logging, Namespace, Pipeline, Preferences, Profile, Provisioners, Replication, Reports,
  Security, Service, Workflow, Monitor, Dashboard, Configuration, Transaction Service, System Workers)
  served under a /v3 path prefix from a self-hosted CDAP router, with Bearer access tokens issued by the
  CDAP authentication server. The company's own cask.co domain and developer portal are gone; the
  surviving surfaces are cdap.io, the CDAP documentation wiki, the cdapio GitHub organization, and the
  io.cdap.cdap / co.cask.cdap artifact groups on Maven Central.
